[package]
name = "ricture"
version = "0.1.0"
edition = "2024"

[features]
# Prints startup timeline, per-frame stage times and memory on exit.
profiling = ["ricture-profile/enabled"]

[dependencies]
ricture-profile = { path = "../profile" }
ricture-capture = { path = "../capture" }
ricture-overlay = { path = "../overlay" }
ricture-config = {path = "../config" }
ricture-export = { path = "../export" }
ricture-notify = { path = "../notify" }
ricture-tools = { path = "../tools" }
chrono = "0.4.45"