[package]
name = "ricture-overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
ricture-capture = { path = "../capture" }
ricture-config = { path = "../config" }
wayland-client = "0.31"
smithay-client-toolkit = "0.21"
tiny-skia = "0.12.0"
bytemuck = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts", "software-renderer-path"] }

[build-dependencies]
slint-build = "1.18"
